# Story categories for Block Quest Daily. Since 2026-11-18 the channel tells Roblox stories over Roblox gameplay
# (Gian: "Block Quest Daily is supposed to be a Roblox channel"). 2026-11-19, Gian: no creepy stories — kid-safe,
# all-ages Roblox content, kept a general-audience channel (not "made for kids"). So: funny, wholesome and
# adventure stories only; creepy servers, scams, hacks, bans, betrayal and revenge are gone. One story a day sits
# beside two interactive Shorts (bqd/interactive.py).
# weight = how often a category is drawn; hints = what the writer is pointed at. A day's stories are drawn from
# distinct categories, avoiding the ones used in the last two days.
categories:
  obby_fails:           {weight: 14, hints: "a tower or obby run, falling one jump from the end, lag at the worst moment, finally beating the stage everyone fails, a stranger who waits at the checkpoint to help", persona: funny}
  lucky_hatch:          {weight: 12, hints: "hatching a super rare pet on the last egg, a legendary drop, giving a rare pet to a friend who never gets lucky, the whole server cheering", persona: excited}
  helping_a_noob:       {weight: 10, hints: "teaching a brand-new player the game, a noob who turns out to be great, being the noob yourself and someone patient showing you", persona: warm}
  roleplay_comedy:      {weight: 10, hints: "a restaurant, school, hospital or town roleplay where everything goes hilariously wrong, a pizza delivered to the wrong house, a mayor with silly rules", persona: sarcastic}
  sibling_shenanigans:  {weight: 10, hints: "a little brother playing on the narrator's account and doing something silly, sharing one tablet, a sister who beats you at your own game, teaming up in the end", persona: confession}
  build_battle:         {weight: 10, hints: "a build contest or tycoon, a build that goes wrong then wins anyway, a last-second idea, judges or voters picking the weirdest build", persona: excited}
  epic_comeback:        {weight: 10, hints: "losing a race, a round or a minigame badly and then winning at the very end, the last player standing in a disaster game", persona: dramatic}
  robux_and_chores:     {weight: 8,  hints: "earning Robux with chores, saving up for weeks, a gift card surprise from a grandparent, spending it on something silly or something kind", persona: confession}
  best_friend_duo:      {weight: 8,  hints: "two friends taking on a hard game together, a promise not to log off until they win, an inside joke from a server, meeting again in a new game", persona: warm}
  fair_trades:          {weight: 8,  hints: "trading up from a common pet to a great one through fair trades, a generous trade from a stranger, saying no to a bad deal and being glad later", persona: calm}

# How each persona tells it (writing style only; one narrator voice reads them all)
personas:
  calm: "level, matter-of-fact, lets the events land on their own"
  dramatic: "short sentences at the turns, builds to the big moment, upbeat, never dark"
  sarcastic: "dry, deadpan, one eyebrow raised, never cruel"
  confession: "first person, a little embarrassed, honest about the silly part they played"
  funny: "playful, quick, the joke is in the details and in the narrator's own mistakes"
  excited: "energetic, can't-believe-it, still specific and concrete"
  warm: "gentle, specific, earns the feeling instead of announcing it"
