# Background gameplay for the Roblox stories (bqd/gameplay.py). Every clip is a 1080x1920, silent, roughly 75-second
# cut of a video its maker published on YouTube under the Creative Commons Attribution licence; the licence line
# and each maker's own terms ("free to use, credit this channel in the description") were read on the video pages
# on 2026-11-18. Each Short credits the maker by name and link in its description. A clip whose source has no
# channel, url and licence here is never used.
#
# The clips are release assets (tag bqd-gameplay-v1); they were cut on the PC with
# cloud/clip-channel/work/bqd-gameplay/get.bat. To add footage: check the licence on the video page, cut it the same
# way, upload the clips to the release, list them here.
