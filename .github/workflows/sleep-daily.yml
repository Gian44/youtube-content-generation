name: sleep-on-facts daily

on:
  schedule:
    # Daily at 15:17 UTC (23:17 Manila) — one long video a day (Gian, 2026-10-25; Mon/Wed/Fri before).
    # GitHub starts scheduled jobs late (3-5 h seen), and an off-the-hour minute helps; the video is
    # uploaded private and YouTube publishes it at 8:30 PM US Eastern, with its first Shorts teaser an
    # hour later and two more on the following days (2026-10-19).
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target narration minutes (<=10 = smoke run, always unlisted)"
        default: "150"
      topic:
        description: "Force a topic by name (optional)"
        default: ""
      privacy:
        description: "public | unlisted | private"
        default: "public"
      skip_upload:
        description: "true = render only, no YouTube"
        default: "false"
      shorts:
        description: "false = no Shorts teasers for this run"
        default: "true"

concurrency:
  group: sleep-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # GitHub's maximum; the Kokoro voice runs on this machine's CPU
    defaults:
      run:
        working-directory: cloud/sleep-on-facts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/sleep-on-facts/requirements.txt
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-wqy-microhei
      - name: Python deps
        # CPU-only PyTorch first (Pocket TTS needs torch; the default Linux wheel would pull ~3 GB of CUDA)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - name: Claude Code CLI (scripts run on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude CLI unavailable; OpenAI/Gemini will write"
      - name: Unit tests
        run: python -m pytest -q
      - name: Kokoro voice model (free, open-weights; cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Pocket TTS model (the narrator's engine; gated on Hugging Face, cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pocket-tts-4.0.1
      - name: Download the Kokoro model if the cache is empty
        working-directory: .
        run: |
          set -e
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL --retry 3 -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL --retry 3 -o voices-v1.0.bin "$base/voices-v1.0.bin"
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin" | sha256sum -c -
      - name: Codex CLI (photo checks on Gian's ChatGPT plan; Claude takes over without it)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "no CODEX_AUTH_JSON secret; photo checks go to Claude"; exit 0; fi
          npm install -g @openai/codex >/dev/null 2>&1 && codex --version || { echo "codex CLI unavailable; Claude checks the photos"; exit 0; }
          export CODEX_HOME="$RUNNER_TEMP/codex"
          if python -c "import os, sys; from sof.vision import prepare_codex_home as p; why = p(os.environ['CODEX_AUTH_JSON'], os.environ['CODEX_HOME']); print(why or 'codex login ready'); sys.exit(1 if why else 0)"; then
            echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          fi
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_MINUTES: ${{ github.event.inputs.minutes || '150' }}
          IN_TOPIC: ${{ github.event.inputs.topic || '' }}
          IN_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          IN_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || 'false' }}
          IN_SHORTS: ${{ github.event.inputs.shorts || 'true' }}
        run: |
          set -e
          ARGS=(--minutes "$IN_MINUTES" --privacy "$IN_PRIVACY")
          if [ -n "$IN_TOPIC" ]; then ARGS+=(--topic "$IN_TOPIC"); fi
          if [ "$IN_SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); fi
          if [ "$IN_SHORTS" = "false" ]; then ARGS+=(--no-shorts); fi
          python run.py "${ARGS[@]}"
      - name: Keep small run artifacts (script, thumbnail, credits, chapters, photo labels, timeline, stills, the Shorts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: |
            cloud/sleep-on-facts/work/**/script.json
            cloud/sleep-on-facts/work/**/thumb.jpg
            cloud/sleep-on-facts/work/**/credits.json
            cloud/sleep-on-facts/work/**/chapters.json
            cloud/sleep-on-facts/work/**/image_labels.json
            cloud/sleep-on-facts/work/**/timeline.json
            cloud/sleep-on-facts/work/**/frames/*.jpg
            cloud/sleep-on-facts/work/**/short*.json
            cloud/sleep-on-facts/work/**/short*.mp4
          if-no-files-found: ignore
          retention-days: 30
      - name: Keep the finished video for the weekly marathon (sof/marathon.py)
        if: success() && fromJSON(github.event.inputs.minutes || '150') > 10 && (github.event.inputs.skip_upload || 'false') == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: media-${{ github.run_id }}
          path: |
            cloud/sleep-on-facts/work/**/final.mp4
            cloud/sleep-on-facts/work/**/chapters.json
            cloud/sleep-on-facts/work/**/thumb_source.jpg
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 45
