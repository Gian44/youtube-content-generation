name: block-quest daily

on:
  schedule:
    # Daily at 10:17 UTC (18:17 Manila): three story Shorts a day, the first live at once, the others 8 h and
    # 16 h later (Gian, 2026-11-07). After the sleep (08:23) and cinybe (09:41) runs so none queue together.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Shorts to make today"
        default: "3"
      category:
        description: "Force a category from topics.yml (optional)"
        default: ""
      smoke:
        description: "true = unlisted upload, ledger untouched"
        default: "false"
      privacy:
        description: "public | unlisted | private"
        default: "public"
      skip_upload:
        description: "true = render only, no YouTube"
        default: "false"

concurrency:
  group: block-quest-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04  # pinned like the sleep workflow: ubuntu-latest (26.04, FFmpeg 8) broke the render tests
    timeout-minutes: 120
    defaults:
      run:
        working-directory: cloud/block-quest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/sleep-on-facts/requirements.txt
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-wqy-microhei
      - name: Python deps (shared with cloud/sleep-on-facts; CPU-only torch for the Pocket TTS voice)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - name: Claude Code CLI (scripts run on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude CLI unavailable; OpenAI/Gemini will write"
      - name: Unit tests (this channel, then the shared cloud/common helpers)
        run: python -m pytest -q && (cd ../common && python -m pytest -q)
      - name: Kokoro voice model (fallback voice; cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Pocket TTS model (voice F; gated on Hugging Face, cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pocket-tts-4.0.1
      - name: Download the Kokoro model if the cache is empty
        working-directory: .
        run: |
          set -e
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL --retry 3 -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL --retry 3 -o voices-v1.0.bin "$base/voices-v1.0.bin"
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin" | sha256sum -c -
      - name: Codex CLI (footage checks on Gian's ChatGPT plan; Claude takes over without it)
        working-directory: cloud/sleep-on-facts
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then echo "no CODEX_AUTH_JSON secret; footage checks go to Claude"; exit 0; fi
          npm install -g @openai/codex >/dev/null 2>&1 && codex --version || { echo "codex CLI unavailable; Claude checks the footage"; exit 0; }
          export CODEX_HOME="$RUNNER_TEMP/codex"
          if python -c "import os, sys; from sof.vision import prepare_codex_home as p; why = p(os.environ['CODEX_AUTH_JSON'], os.environ['CODEX_HOME']); print(why or 'codex login ready'); sys.exit(1 if why else 0)"; then
            echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          fi
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BLOCKQUEST: ${{ secrets.GEMINI_API_KEY_BLOCKQUEST }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_BLOCKQUEST: ${{ secrets.YT_CLIENT_ID_BLOCKQUEST }}
          YT_CLIENT_SECRET_BLOCKQUEST: ${{ secrets.YT_CLIENT_SECRET_BLOCKQUEST }}
          YT_REFRESH_TOKEN_BLOCKQUEST: ${{ secrets.YT_REFRESH_TOKEN_BLOCKQUEST }}
          # voice F (Pocket TTS on the runner). Set to "gemini" once GEMINI_API_KEY_BLOCKQUEST exists (Charon, free tier).
          TTS_BACKEND: pocket
          IN_COUNT: ${{ github.event.inputs.count || '3' }}
          IN_CATEGORY: ${{ github.event.inputs.category || '' }}
          IN_SMOKE: ${{ github.event.inputs.smoke || 'false' }}
          IN_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          IN_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || 'false' }}
        run: |
          set -e
          ARGS=(--count "$IN_COUNT" --privacy "$IN_PRIVACY")
          if [ -n "$IN_CATEGORY" ]; then ARGS+=(--category "$IN_CATEGORY"); fi
          if [ "$IN_SMOKE" = "true" ]; then ARGS+=(--smoke); fi
          if [ "$IN_SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); fi
          python run.py "${ARGS[@]}"
      - name: Keep small run artifacts (stories, footage lists, stills, the Shorts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-quest-run-${{ github.run_id }}
          path: |
            cloud/block-quest/work/**/stories.json
            cloud/block-quest/work/**/footage.json
            cloud/block-quest/work/**/frames/*.jpg
            cloud/block-quest/work/**/short*.mp4
          if-no-files-found: ignore
          retention-days: 30
