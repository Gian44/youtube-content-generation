name: sylusnix daily

on:
  # schedule is added once a smoke run has passed on a GitHub runner (YouTube may refuse downloads from cloud IPs)
  workflow_dispatch:
    inputs:
      count:
        description: "Clips to post"
        default: "3"
      smoke:
        description: "true = unlisted uploads, ledger untouched"
        default: "false"
      privacy:
        description: "public | unlisted | private"
        default: "public"

concurrency:
  group: sylusnix-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cloud/clip-channel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/clip-channel/requirements.txt
      - name: System deps (ffmpeg, Arial-compatible and colour emoji fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Claude Code CLI (moment picking runs on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: Run pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_SYLUSNIX }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_SYLUSNIX }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_SYLUSNIX }}
          IN_COUNT: ${{ github.event.inputs.count || '3' }}
          IN_SMOKE: ${{ github.event.inputs.smoke || 'false' }}
          IN_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          set -e
          umask 077
          printf 'YT_CLIENT_ID=%s\nYT_CLIENT_SECRET=%s\nYT_REFRESH_TOKEN=%s\n' "$YT_CLIENT_ID" "$YT_CLIENT_SECRET" "$YT_REFRESH_TOKEN" > .env
          PRIVACY="$IN_PRIVACY"
          if [ "$IN_SMOKE" = "true" ]; then PRIVACY=unlisted; fi
          python -u run.py daily --count "$IN_COUNT" --privacy "$PRIVACY"
          rm -f .env
      - name: Commit the ledger (skipped on smoke runs)
        if: ${{ success() && (github.event.inputs.smoke || 'false') != 'true' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/clip-channel/ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "ledger: sylusnix $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
      - name: "Keep the run's clip details (no video files, the repo is public)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sylusnix-run-${{ github.run_id }}
          path: cloud/clip-channel/out/**/info.json
          if-no-files-found: ignore
          retention-days: 14
