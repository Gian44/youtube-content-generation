name: sleep-on-facts credits site

# One-time (and after edits to sof/credits_site.py's Worker): creates the KV namespace, deploys the Worker
# that serves the per-video photo-credits pages, writes a test page and prints the site's URL. Needs the
# CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template) and CLOUDFLARE_ACCOUNT_ID secrets. The daily
# run re-deploys on its own if the site stops answering, so this is a convenience, not a dependency.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/sleep-on-facts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python deps (only what the site needs)
        run: pip install "httpx>=0.27"
      - name: Deploy the credits site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m sof.credits_site deploy
