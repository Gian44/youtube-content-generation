name: cinybe-shorts daily

on:
  schedule:
    # Daily (Gian, 2026-11-12): one ~17-min recap per UTC day. GitHub starts these hours late (6.5-10.3 h measured
    # on 11-08..11-11) and sometimes drops one, so there are four triggers; the gate job below lets only the first
    # one that lands after 09:00 UTC (17:00 Manila) on a day without a recap go on to render (cny/daily.py), the
    # others end in seconds. Early triggers on purpose: started on time, 01:41/05:41 are held and 09:41 renders;
    # started ~8 h late, 01:41 renders and the rest are same-day retries. (Evening triggers would land after
    # midnight and be held.) Off-the-hour minutes, clear of the sleep (08:23) and Block Quest (10:17) runs. The film
    # is Gian's file in the Drive folder or, when that is empty, the next public-domain print from the Internet
    # Archive (films.yml `archive:`); nothing else, ever (Gian, 2026-11-08: no stock fallback).
    - cron: "41 1 * * *"
    - cron: "41 5 * * *"
    - cron: "41 9 * * *"
    - cron: "41 13 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Target recap minutes (<=3 = smoke run, always unlisted)"
        default: "17"
      film:
        description: "Force a film title (optional; with year)"
        default: ""
      year:
        description: "The film's year (with film)"
        default: ""
      privacy:
        description: "public | unlisted | private"
        default: "public"
      skip_upload:
        description: "true = render only, no YouTube"
        default: "false"
      shorts:
        description: "false = no Shorts for this run"
        default: "true"

concurrency:
  group: cinybe-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}     # the branch head now, not the commit the trigger saw (a queued run must see today's row)
          sparse-checkout: cloud/cinybe-shorts
      - name: Today's recap already up? (scheduled triggers only; manual runs always go on)
        id: gate
        working-directory: cloud/cinybe-shorts
        run: python3 gate.py

  render:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04  # pinned like the sleep workflow: ubuntu-latest (26.04, FFmpeg 8) broke the render tests
    timeout-minutes: 300          # a film without .srt adds a CPU transcription
    defaults:
      run:
        working-directory: cloud/cinybe-shorts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}     # latest ledger, for the same reason
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/sleep-on-facts/requirements.txt
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-wqy-microhei
      - name: Python deps (shared with cloud/sleep-on-facts; CPU-only torch for the Pocket TTS voice)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - name: Claude Code CLI (scripts run on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude CLI unavailable; OpenAI/Gemini will write"
      - name: Unit tests (this channel, then the shared cloud/common helpers)
        run: python -m pytest -q && (cd ../common && python -m pytest -q)
      - name: Kokoro voice model (fallback voice; cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Pocket TTS model (voice F; gated on Hugging Face, cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: pocket-tts-4.0.1
      - name: faster-whisper model (only used when a film has no .srt; cached once downloaded)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-small
          key: faster-whisper-small
      - name: Download the Kokoro model if the cache is empty
        working-directory: .
        run: |
          set -e
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL --retry 3 -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL --retry 3 -o voices-v1.0.bin "$base/voices-v1.0.bin"
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin" | sha256sum -c -
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_CINYBE: ${{ secrets.GEMINI_API_KEY_CINYBE }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # the film files Gian supplies: a Google Drive folder shared with a service account (first choice), or an R2
          # bucket. No film in the store → nothing is posted.
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_FOLDER: cinybe-films
          # subtitles for a film file that has none (hash match first); without these the runner transcribes on the CPU
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          OPENSUBTITLES_USERNAME: ${{ secrets.OPENSUBTITLES_USERNAME }}
          OPENSUBTITLES_PASSWORD: ${{ secrets.OPENSUBTITLES_PASSWORD }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'cinybe-films' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_CLIENT_ID_CINYBE: ${{ secrets.YT_CLIENT_ID_CINYBE }}
          YT_CLIENT_SECRET_CINYBE: ${{ secrets.YT_CLIENT_SECRET_CINYBE }}
          YT_REFRESH_TOKEN_CINYBE: ${{ secrets.YT_REFRESH_TOKEN_CINYBE }}
          # voice F (Pocket TTS on the runner). Set to "gemini" once GEMINI_API_KEY_CINYBE exists (Charon, free tier).
          TTS_BACKEND: pocket
          IN_MINUTES: ${{ github.event.inputs.minutes || '17' }}
          IN_FILM: ${{ github.event.inputs.film || '' }}
          IN_YEAR: ${{ github.event.inputs.year || '' }}
          IN_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          IN_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || 'false' }}
          IN_SHORTS: ${{ github.event.inputs.shorts || 'true' }}
        run: |
          set -e
          ARGS=(--minutes "$IN_MINUTES" --privacy "$IN_PRIVACY")
          if [ -n "$IN_FILM" ]; then ARGS+=(--film "$IN_FILM"); fi
          if [ -n "$IN_YEAR" ]; then ARGS+=(--year "$IN_YEAR"); fi
          if [ "$IN_SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); fi
          if [ "$IN_SHORTS" = "false" ]; then ARGS+=(--no-shorts); fi
          rc=0; python run.py "${ARGS[@]}" || rc=$?
          if [ "$rc" = "5" ]; then
            # no film in the store: by design nothing is posted — a green run with a notice, not a daily red X
            echo "::notice title=cinybe: nothing posted::no queued film could be had (Drive folder empty, archive queue exhausted or skipped)"
            exit 0
          fi
          exit "$rc"
      - name: Keep run artifacts (plan, transcript, chapters, visuals, thumbnail, stills, the Shorts; the full recap on review runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinybe-run-${{ github.run_id }}
          path: |
            cloud/cinybe-shorts/work/**/plan.json
            cloud/cinybe-shorts/work/**/plot.json
            cloud/cinybe-shorts/work/**/meta.json
            cloud/cinybe-shorts/work/**/chapters.json
            cloud/cinybe-shorts/work/**/beats.json
            cloud/cinybe-shorts/work/**/cuts.json
            cloud/cinybe-shorts/work/**/transcript.txt
            cloud/cinybe-shorts/work/**/thumb.jpg
            cloud/cinybe-shorts/work/**/frames/*.jpg
            cloud/cinybe-shorts/work/**/short*.mp4
            cloud/cinybe-shorts/work/**/review/*
          if-no-files-found: ignore
          retention-days: 30
