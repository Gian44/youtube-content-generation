name: sylusnix explainers

# sylusnix re-launched 2026-11-26 (Gian, 2026-11-25: "Do that instead ... long form and short form ... start
# tomorrow"): original stick-figure explainers, cloud/doodle-explainer. Replaces the Twitch-clip lane.
# 13:11 UTC = the long video (the code makes one every second day from 2026-11-26 and skips the other days);
# 21:23 UTC = 2 Shorts, the first public at once (afternoon in the US), the second 8 h later.
on:
  schedule:
    - cron: "11 13 * * *"
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "short | long"
        default: "short"
      count:
        description: "Shorts to make (kind short)"
        default: "2"
      question:
        description: "Force the question (optional)"
        default: ""
      force:
        description: "true = long video even on an off day"
        default: "false"
      smoke:
        description: "true = unlisted upload, ledger untouched"
        default: "false"
      skip_upload:
        description: "true = render only, no YouTube"
        default: "false"

concurrency:
  group: sylusnix-explainers-${{ github.event.inputs.kind || (github.event.schedule == '11 13 * * *' && 'long' || 'short') }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: cloud/doodle-explainer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/sleep-on-facts/requirements.txt
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 fonts-comic-neue fonts-dejavu-core
      - name: Python deps (shared with cloud/sleep-on-facts; CPU-only torch for its Pocket TTS fallback)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
      - name: Claude Code CLI (scripts and drawings on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version || echo "claude CLI unavailable; OpenAI/Gemini will write"
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Kokoro voice model (cached between runs)
        uses: actions/cache@v4
        with:
          path: ~/.cache/kokoro
          key: kokoro-v1.0
      - name: Download the Kokoro model if the cache is empty
        working-directory: .
        run: |
          set -e
          mkdir -p ~/.cache/kokoro && cd ~/.cache/kokoro
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -fsSL --retry 3 -o kokoro-v1.0.onnx "$base/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -fsSL --retry 3 -o voices-v1.0.bin "$base/voices-v1.0.bin"
          echo "7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5  kokoro-v1.0.onnx" | sha256sum -c -
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  voices-v1.0.bin" | sha256sum -c -
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID_SYLUSNIX: ${{ secrets.YT_CLIENT_ID_SYLUSNIX }}
          YT_CLIENT_SECRET_SYLUSNIX: ${{ secrets.YT_CLIENT_SECRET_SYLUSNIX }}
          YT_REFRESH_TOKEN_SYLUSNIX: ${{ secrets.YT_REFRESH_TOKEN_SYLUSNIX }}
          IN_KIND: ${{ github.event.inputs.kind || (github.event.schedule == '11 13 * * *' && 'long' || 'short') }}
          IN_COUNT: ${{ github.event.inputs.count || '2' }}
          IN_QUESTION: ${{ github.event.inputs.question || '' }}
          IN_FORCE: ${{ github.event.inputs.force || 'false' }}
          IN_SMOKE: ${{ github.event.inputs.smoke || 'false' }}
          IN_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || 'false' }}
        run: |
          set -e
          ARGS=(--kind "$IN_KIND" --count "$IN_COUNT")
          if [ -n "$IN_QUESTION" ]; then ARGS+=(--question "$IN_QUESTION"); fi
          if [ "$IN_FORCE" = "true" ]; then ARGS+=(--force); fi
          if [ "$IN_SMOKE" = "true" ]; then ARGS+=(--smoke); fi
          if [ "$IN_SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); fi
          python run.py "${ARGS[@]}"
      - name: Keep run artifacts (scripts, a contact sheet, the videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sylusnix-explainers-${{ github.run_id }}
          path: |
            cloud/doodle-explainer/work/**/script.json
            cloud/doodle-explainer/work/**/question.json
            cloud/doodle-explainer/work/**/*.mp4
            cloud/doodle-explainer/work/**/thumb.jpg
          if-no-files-found: ignore
          retention-days: 14
