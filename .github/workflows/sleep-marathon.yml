name: sleep-on-facts marathon

# Weekly: three recent long videos joined into one ~9-hour upload (cloud/sleep-on-facts/sof/marathon.py,
# Gian 2026-10-25). Uses the media-<run id> artifacts the daily runs keep for 45 days; no new narration.
on:
  schedule:
    - cron: "17 12 * * 0"        # Sundays 12:17 UTC; published at 7:30 PM US Eastern, an hour before the daily video
  workflow_dispatch:
    inputs:
      group:
        description: "auto | mix | a category name from topics.yml"
        default: "auto"
      size:
        description: "videos per marathon"
        default: "3"
      privacy:
        description: "public | unlisted | private"
        default: "public"
      skip_upload:
        description: "true = build only, no YouTube"
        default: "false"

concurrency:
  group: sleep-marathon
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  marathon:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: cloud/sleep-on-facts
    steps:
      - name: Free disk space (three 3-hour videos in, one 9-hour video out)
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /mnt || true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/sleep-on-facts/requirements.txt
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Build and upload the marathon
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IN_GROUP: ${{ github.event.inputs.group || 'auto' }}
          IN_SIZE: ${{ github.event.inputs.size || '3' }}
          IN_PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
          IN_SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || 'false' }}
        run: |
          set -e
          ARGS=(--group "$IN_GROUP" --size "$IN_SIZE" --privacy "$IN_PRIVACY" --work "$RUNNER_TEMP/marathon")
          if [ "$IN_SKIP_UPLOAD" = "true" ]; then ARGS+=(--skip-upload); fi
          python marathon.py "${ARGS[@]}"
      - name: Keep the marathon's thumbnail and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marathon-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/marathon/thumb.jpg
            ${{ runner.temp }}/marathon/meta.json
          if-no-files-found: ignore
          retention-days: 30
