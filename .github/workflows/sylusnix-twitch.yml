name: sylusnix twitch

# One ranking Short from a streamer's most-viewed Twitch clips. Twitch serves clips to GitHub's runners (YouTube does
# not), so this lane of the sylusnix channel runs here; the YouTube-sourced lane runs on the PC.
on:
  # Daily from the GTA 6 release (2026-11-19): one ranking of a verified streamer's GTA 6 clips. A scheduled run uses
  # the GAME/SINCE defaults below and makes nothing on a day with fewer than 5 usable clips.
  schedule:
    - cron: "7 15 * * *"
  workflow_dispatch:
    inputs:
      game:
        description: "Twitch category to rank (blank = any game; 'default' = the scheduled run's game)"
        default: ""
      since:
        description: "With a game: ignore clips made before this day (YYYY-MM-DD)"
        default: ""
      streamer:
        description: "Twitch login (blank = the verified streamer ranked least recently)"
        default: ""
      smoke:
        description: "true = unlisted upload, ledger untouched"
        default: "false"
      force:
        description: "true = ignore the days-between rule"
        default: "false"

concurrency:
  group: sylusnix-twitch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cloud/clip-channel
    env:
      SMOKE: ${{ github.event.inputs.smoke || 'false' }}
      # every spelling Twitch might use for the category; the label is what titles and tags say
      GAME_DEFAULT: "Grand Theft Auto VI,Grand Theft Auto 6,GTA VI,GTA 6"
      GAME_LABEL_DEFAULT: "GTA 6"
      SINCE_DEFAULT: "2026-11-19"
      # a day of one game has far fewer views per clip than a month of everything: Kai Cenat's first GTA 6 day
      # (2026-11-18) topped out at 5,001 views, so the lane's usual 10,000 floor would never make a game ranking
      GAME_MIN_VIEWS_DEFAULT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/clip-channel/requirements.txt
      - name: System deps (ffmpeg, Arial-compatible and colour emoji fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
      - name: Python deps
        run: pip install -q -r requirements.txt
      - name: Speech-to-text model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Claude Code CLI (labels and cut points run on Gian's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN)
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 && claude --version
      - name: Make and post the ranking
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID_SYLUSNIX }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET_SYLUSNIX }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_SYLUSNIX }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          IN_STREAMER: ${{ github.event.inputs.streamer || '' }}
          IN_FORCE: ${{ github.event.inputs.force || 'false' }}
          IN_GAME: ${{ github.event.inputs.game || '' }}
          IN_SINCE: ${{ github.event.inputs.since || '' }}
          EVENT: ${{ github.event_name }}
        run: |
          set -e
          umask 077
          printf 'YT_CLIENT_ID=%s\nYT_CLIENT_SECRET=%s\nYT_REFRESH_TOKEN=%s\n' "$YT_CLIENT_ID" "$YT_CLIENT_SECRET" "$YT_REFRESH_TOKEN" > .env
          ARGS="--upload"
          if [ "$SMOKE" = "true" ]; then ARGS="$ARGS --privacy unlisted --force"; fi
          if [ "$IN_FORCE" = "true" ] && [ "$SMOKE" != "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "$IN_STREAMER" ]; then ARGS="$ARGS --streamer $IN_STREAMER"; fi
          GAME="$IN_GAME"; SINCE="$IN_SINCE"; LABEL=""
          if [ "$EVENT" = "schedule" ] || [ "$IN_GAME" = "default" ]; then
            GAME="$GAME_DEFAULT"; LABEL="$GAME_LABEL_DEFAULT"; SINCE="${IN_SINCE:-$SINCE_DEFAULT}"
            ARGS="$ARGS --every 1 --min-views $GAME_MIN_VIEWS_DEFAULT"   # a game ranking a day; used clips are never ranked twice
          fi
          if [ -n "$GAME" ]; then
            python -u run.py twitch $ARGS --game "$GAME" ${LABEL:+--game-label "$LABEL"} ${SINCE:+--since "$SINCE"}
          else
            python -u run.py twitch $ARGS
          fi
          rm -f .env
      - name: Frame sheet of the result (smoke runs only, for checking the look)
        if: ${{ success() && env.SMOKE == 'true' }}
        run: |
          f=$(ls out/*/twitch-*/option1.mp4 2>/dev/null | head -1)
          [ -n "$f" ] && ffmpeg -y -v error -i "$f" -vf "fps=1/2.8,scale=300:-1,tile=8x2" -frames:v 1 "$(dirname "$f")/sheet.jpg" || true
      - name: Commit the Twitch ledger (skipped on smoke runs)
        if: ${{ success() && env.SMOKE != 'true' }}
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/clip-channel/ledger_twitch.json
          git diff --cached --quiet && exit 0
          git commit -m "ledger: sylusnix twitch $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
      - name: "Keep the run's details (no video files, the repo is public)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sylusnix-twitch-${{ github.run_id }}
          path: |
            cloud/clip-channel/out/**/info.json
            cloud/clip-channel/out/**/sheet.jpg
          if-no-files-found: ignore
          retention-days: 14
