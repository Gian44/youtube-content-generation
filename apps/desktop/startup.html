<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoryFactory</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Segoe UI, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #101114;
      color: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(36, 115, 203, 0.28), transparent 32rem),
        #101114;
    }

    main {
      width: min(520px, calc(100vw - 48px));
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: 0;
    }

    #statusText {
      margin: 0;
      font-size: 17px;
      color: #d8deea;
    }

    #detailText {
      margin: 10px 0 0;
      min-height: 22px;
      font-size: 14px;
      color: #9aa6bb;
    }

    .bar {
      width: 100%;
      height: 6px;
      margin-top: 28px;
      overflow: hidden;
      background: #2a2f3a;
      border-radius: 999px;
    }

    .bar span {
      display: block;
      width: 42%;
      height: 100%;
      background: #58a6ff;
      border-radius: inherit;
      animation: slide 1.15s ease-in-out infinite;
    }

    #errorPanel {
      display: none;
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #7f2f3b;
      background: #291317;
      border-radius: 8px;
      color: #ffd8de;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: none;
      gap: 10px;
      margin-top: 18px;
    }

    button {
      height: 36px;
      border: 0;
      border-radius: 7px;
      padding: 0 14px;
      color: #ffffff;
      background: #2563eb;
      font: inherit;
      cursor: pointer;
    }

    button.secondary {
      background: #303745;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(80%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <main>
    <h1>StoryFactory</h1>
    <p id="statusText">Starting desktop app</p>
    <p id="detailText">Preparing the dashboard.</p>
    <div class="bar" aria-hidden="true"><span></span></div>
    <pre id="errorPanel"></pre>
    <div class="actions" id="errorActions">
      <button id="retryButton" type="button">Retry</button>
      <button id="quitButton" class="secondary" type="button">Quit</button>
    </div>
  </main>

  <script>
    const statusText = document.getElementById('statusText');
    const detailText = document.getElementById('detailText');
    const errorPanel = document.getElementById('errorPanel');
    const errorActions = document.getElementById('errorActions');
    const retryButton = document.getElementById('retryButton');
    const quitButton = document.getElementById('quitButton');

    retryButton.addEventListener('click', () => window.storyfactory.startupRetry());
    quitButton.addEventListener('click', () => window.storyfactory.startupQuit());

    window.storyfactory.onStartupProgress((event) => {
      statusText.textContent = event.status || 'Starting StoryFactory';
      detailText.textContent = event.detail || '';

      if (event.error) {
        errorPanel.style.display = 'block';
        errorActions.style.display = 'flex';
        errorPanel.textContent = event.error;
      } else {
        errorPanel.style.display = 'none';
        errorActions.style.display = 'none';
        errorPanel.textContent = '';
      }
    });
  </script>
</body>
</html>
