[project]
name = "storyfactory-worker"
version = "1.0.0"
description = "StoryFactory content generation worker"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "google-generativeai>=0.7.0",
    "httpx>=0.27.0",
    "ffmpeg-python>=0.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "Pillow>=10.3.0",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "boto3>=1.34.0",
    "tenacity>=8.3.0",
    "jinja2>=3.1.0",
    "structlog>=24.1.0",
    "hashlib-additional>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
